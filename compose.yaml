name: qiyu-nas

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      # Leave the host address unspecified so Docker publishes the portal on
      # both IPv4 and IPv6. Pinning this to 0.0.0.0 makes a Tailscale IPv6
      # address unreachable after the container is recreated.
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NAS_ROOT:-./data}/sites:/srv/sites:ro
      - ${CONFIG_ROOT:-./config}/caddy/data:/data
      - ${CONFIG_ROOT:-./config}/caddy/config:/config
    depends_on:
      - portal
      - jellyfin
    networks:
      - qiyu

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      STORAGE_ROOT: /storage
      NAS_HOSTNAME: ${NAS_HOSTNAME:-qiyu-nas}
      # Browser-facing Qiyu login only. These are separate from the private
      # Jellyfin service credentials below.
      NAS_USERNAME: ${NAS_USERNAME}
      NAS_PASSWORD: ${NAS_PASSWORD}
      COLLECTOR_BASE_URL: http://collector:9090
      # Internal API calls stay on Docker's private network. Override this
      # when Jellyfin itself has a Base URL, for example /jellyfin.
      JELLYFIN_BASE_URL: ${JELLYFIN_BASE_URL:-http://jellyfin:8096}
      # A private service account used only by the portal's server-side
      # Jellyfin API client. It is intentionally separate from NAS_*.
      JELLYFIN_USERNAME: ${JELLYFIN_USERNAME}
      JELLYFIN_PASSWORD: ${JELLYFIN_PASSWORD}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false}
    volumes:
      - ${NAS_ROOT:-./data}:/storage
    user: "${PUID:-1000}:${PGID:-1000}"
    expose:
      - "3000"
    networks:
      - qiyu
    depends_on:
      - collector

  collector:
    build:
      context: ./collector
      args:
        COLLECTOR_BASE: ${COLLECTOR_BASE:-alpine:3.22}
        EXTRA_CA_CERTIFICATE_B64: ${COLLECTOR_EXTRA_CA_CERTIFICATE_B64:-}
    restart: unless-stopped
    environment:
      STORAGE_ROOT: /storage
      CONFIG_ROOT: /config
      COLLECTOR_MAX_FILESIZE: ${COLLECTOR_MAX_FILESIZE:-10G}
      COLLECTOR_MAX_HEIGHT: ${COLLECTOR_MAX_HEIGHT:-1440}
    volumes:
      - ${NAS_ROOT:-./data}:/storage
      - ${CONFIG_ROOT:-./config}/collector:/config
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    shm_size: 256mb
    expose:
      - "9090"
    networks:
      - qiyu

  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /config
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin/config:/config
      - ${CONFIG_ROOT:-./config}/jellyfin/cache:/cache
      - ${NAS_ROOT:-./data}/media:/media:ro
    expose:
      - "8096"
    networks:
      - qiyu

networks:
  qiyu:
    driver: bridge
