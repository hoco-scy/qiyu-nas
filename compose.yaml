name: qiyu-nas

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_ADDRESS:-0.0.0.0}:${PORTAL_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${NAS_ROOT:-./data}/sites:/srv/sites:ro
      - ${CONFIG_ROOT:-./config}/caddy/data:/data
      - ${CONFIG_ROOT:-./config}/caddy/config:/config
    depends_on:
      - portal
      - jellyfin
    networks:
      - qiyu

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    restart: unless-stopped
    environment:
      STORAGE_ROOT: /storage
      NAS_HOSTNAME: ${NAS_HOSTNAME:-qiyu-nas}
      COLLECTOR_BASE_URL: http://collector:9090
      # Internal API calls use the private Docker address, not Caddy's
      # browser-facing /jellyfin/ route.
      JELLYFIN_BASE_URL: http://jellyfin:8096
      JELLYFIN_USERNAME: ${NAS_USERNAME}
      JELLYFIN_PASSWORD: ${NAS_PASSWORD}
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_COOKIE_SECURE: ${PORTAL_COOKIE_SECURE:-false}
    volumes:
      - ${NAS_ROOT:-./data}:/storage
    user: "${PUID:-1000}:${PGID:-1000}"
    expose:
      - "3000"
    networks:
      - qiyu
    depends_on:
      - collector

  collector:
    build:
      context: ./collector
    restart: unless-stopped
    environment:
      STORAGE_ROOT: /storage
      CONFIG_ROOT: /config
      COLLECTOR_MAX_FILESIZE: ${COLLECTOR_MAX_FILESIZE:-5G}
    volumes:
      - ${NAS_ROOT:-./data}:/storage
      - ${CONFIG_ROOT:-./config}/collector:/config
    user: "${PUID:-1000}:${PGID:-1000}"
    expose:
      - "9090"
    networks:
      - qiyu

  jellyfin:
    image: ghcr.io/jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /config
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin/config:/config
      - ${CONFIG_ROOT:-./config}/jellyfin/cache:/cache
      - ${NAS_ROOT:-./data}/media:/media:ro
    expose:
      - "8096"
    networks:
      - qiyu

networks:
  qiyu:
    driver: bridge
