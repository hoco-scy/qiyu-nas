<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>栖屿 · 我的网页</title>
    <style>
      :root { color-scheme: dark; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #e8f3ee; background: radial-gradient(circle at 20% 15%, #21443c 0, transparent 34%), #10201f; }
      main { width: min(720px, calc(100% - 40px)); padding: 48px; border: 1px solid #ffffff18; border-radius: 28px; background: #ffffff08; box-shadow: 0 30px 80px #0006; }
      span { color: #70d7b0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 20px 0 12px; font-size: clamp(36px, 7vw, 66px); line-height: 1.05; letter-spacing: -.04em; }
      p { max-width: 560px; color: #a5b8b1; line-height: 1.8; }
      a { display: inline-block; margin-top: 24px; padding: 11px 16px; color: #18352d; background: #70d7b0; border-radius: 12px; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <span>Hosted by Qiyu NAS</span>
      <h1>这是你的第一座小岛。</h1>
      <p>把这个目录里的 index.html 换成自己的作品，Caddy 会立即发布新内容，不需要重新启动容器。</p>
      <a href="/">返回栖屿首页</a>
    </main>
  </body>
</html>
